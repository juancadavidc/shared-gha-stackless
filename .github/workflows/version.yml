name: version

# Versionado semver automático. Cuando self-test pasa sobre un push a main, lee los commits
# (conventional commits) desde el último tag vX.Y.Z y decide el salto:
#
#   feat!: / fix(x)!: / "BREAKING CHANGE:" en el cuerpo  → major
#   feat:                                                → minor
#   fix: / perf:                                         → patch
#   docs, chore, ci, test, refactor, style, build        → sin versión
#
# Crea el tag vX.Y.Z con su release y mueve el tag de major (v1, v2...) al mismo commit. Un
# major nuevo abre su propio tag (v2) y deja v1 donde estaba: los consumidores de @v1 no
# reciben el cambio incompatible.

on:
  workflow_run:
    workflows: [self-test]
    types: [completed]
    branches: [main]

# Dos merges seguidos no deben calcular la misma versión.
concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Calcular la versión
        id: next
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$SHA" 2>/dev/null || true)"
          if [ -n "$last" ] && [ "$(git rev-list -n1 "$last")" = "$SHA" ]; then
            echo "El commit ya tiene $last, nada que hacer."
            exit 0
          fi

          range="$SHA"
          [ -n "$last" ] && range="$last..$SHA"
          subjects="$(git log --no-merges --format='%s' "$range")"
          bodies="$(git log --no-merges --format='%b' "$range")"

          type_re='^[a-z]+(\([^)]*\))?'
          bump=""
          if grep -qE "${type_re}!:" <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump="major"
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            bump="minor"
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<<"$subjects"; then
            bump="patch"
          fi

          if [ -z "$bump" ]; then
            echo "Sin feat/fix/perf/breaking desde ${last:-el inicio}: no se versiona."
            exit 0
          fi

          IFS=. read -r major minor patch <<<"${last#v}"
          major="${major:-0}" minor="${minor:-0}" patch="${patch:-0}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          version="v${major}.${minor}.${patch}"
          echo "${last:-(sin tag)} → $version ($bump)"
          {
            echo "version=$version"
            echo "major=v${major}"
          } >>"$GITHUB_OUTPUT"

      - name: Crear tag, release y mover el major
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.next.outputs.version }}
          MAJOR: ${{ steps.next.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION" "$SHA"
          git tag -f "$MAJOR" "$SHA"
          git push origin "$VERSION"
          git push -f origin "$MAJOR"

          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
