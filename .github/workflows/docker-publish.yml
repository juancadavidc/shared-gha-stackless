name: docker-publish

# Build + push a ghcr.io/<owner>/<repo>/<service> con cada sufijo de `tags`. Se autentica con
# el GITHUB_TOKEN del repo que llama: su job necesita `packages: write`.

on:
  workflow_call:
    inputs:
      context:
        description: Contexto del build de Docker
        type: string
        default: .
      dockerfile:
        description: Ruta del Dockerfile (por defecto, <context>/Dockerfile)
        type: string
        default: ""
      service:
        description: Último segmento del nombre de la imagen (ghcr.io/<owner>/<repo>/<service>)
        type: string
        default: web
      tags:
        description: Tags a publicar, separados por espacio o salto de línea (p. ej. "staging <sha>")
        type: string
        required: true
      build-args:
        description: Build args, una línea KEY=VAL por arg
        type: string
        default: ""
      ref:
        description: Commit, rama o tag a construir (por defecto, el del evento)
        type: string
        default: ""
    outputs:
      image:
        description: Nombre de la imagen sin tag
        value: ${{ jobs.publish.outputs.image }}

jobs:
  publish:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Nombre y tags de la imagen
        id: image
        # GHCR exige minúsculas y github.repository puede traer mayúsculas.
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ inputs.service }}
          TAGS: ${{ inputs.tags }}
        run: |
          name="ghcr.io/${REPOSITORY,,}/${SERVICE,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            for tag in $TAGS; do echo "$name:$tag"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tags }}
