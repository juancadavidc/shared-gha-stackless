# Fixture de compose-ci: dos servicios chicos, cada uno con healthcheck.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d ci"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
